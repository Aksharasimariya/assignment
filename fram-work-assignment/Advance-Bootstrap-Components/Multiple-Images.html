<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>
<body>

  <div class="container bg-dark">
  <div class="gallery col-lg-12 mx-auto">
    <h1 class="gallery-title">Portfolio Gallery</h1>
  </div>
  <div class="">
    <button class="btn btn-default mb-3 fs-4 fw-semibold text-white">All</button>
    <button class="btn btn-default mb-3 fs-4 fw-semibold text-white">Nature</button>
    <button class="btn btn-default mb-3 fs-4 fw-semibold text-white">People</button>
    <button class="btn btn-default mb-3 fs-4 fw-semibold text-white">Cars</button>
    <button class="btn btn-default mb-3 fs-4 fw-semibold text-white">Buildings</button>
  </div> 

  <div id="carouselExampleDark" class="carousel carousel-dark slide">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="1" aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="2" aria-label="Slide 3"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active" data-bs-interval="10000">
        <img src="./images/building1.jpeg" class="d-block w-100" style="height:500px; object-fit: cover;"alt="...">
      </div>
      <div class="carousel-item" data-bs-interval="2000">
        <img src="./images/building2.jpeg" class="d-block w-100" style="height:500px; object-fit: cover;" alt="...">
      </div>
      <div class="carousel-item">
        <img src="./images/nature1.jpeg" class="d-block w-100" style="height:500px; object-fit: cover;" alt="...">
    </div>
    <div class="carousel-item">
      <img src="./images/cars2.webp" class="d-block w-100" style="height:500px; object-fit: cover;" alt="...">
  </div>
  
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleDark" data-bs-slide="prev">
      <span class="carousel-control-prev-icon w-2 h-2 bg-black font-bold-white" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleDark" data-bs-slide="next">
      <span class="carousel-control-next-icon w-2 h-2 bg-black font-bold-white" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
</div>
</div>
</body>
</html>
