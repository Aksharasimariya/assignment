<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <style>
        .btn{
            border-radius: 0;
            margin-right: 20px;
        }
        .btn-1:hover{
            background-color: black;
        }
        .btn-2{
            transition: 0.4s all;
        }
        .btn-2:hover{
            transform:scale(1.2);
        }
        .btn-3{
            transition: .2s all;
            width: 100px;
        }
        .btn-3:hover{
            font-weight: bold;
            border-radius: 5px;
        }
        .btn-4{
            transition: .4s all;
        }
        .btn-4:hover{
            transform:translateY(-5px) ;
        }
    </style>

</head>
<body>
    <div class="container mt-5">
        <h4 class="my-4">Button Style 1</h4>
        <button class="btn btn-primary btn-1">Button</button>
        <button class="btn btn-success btn-1">Button</button>
        <button class="btn btn-danger btn-1">Button</button>

        <hr>
        <h4 class="my-4">Button Style 2</h4>
        <button class="btn btn-primary btn-2">Button</button>
        <button class="btn btn-success btn-2">Button</button>
        <button class="btn btn-danger btn-2">Button</button>

        <hr>
        <h4 class="my-4">Button Style 3</h4>
        <button class="btn btn-primary btn-3">Button</button>
        <button class="btn btn-success btn-3">Button</button>
        <button class="btn btn-danger btn-3">Button</button>

        <hr>
        <h4 class="my-4">Button Style 4</h4>
        <button class="btn btn-primary btn-4">Button</button>
        <button class="btn btn-success btn-4">Button</button>
        <button class="btn btn-danger btn-4">Button</button>
    </div>
</body>
</html>
