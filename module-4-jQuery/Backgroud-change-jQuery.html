<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        body{
            text-align: center;
            background-color:gray;
        }
        h1{
            margin-top: 100px;
            font-size: 40px;
        }
        button{
            width: 140px;
            height: 100px;
            padding: 20px;
            margin: 10px;
            border-radius: 25px;
            font-size: 20px;
            border:2px solid gray;
            cursor: pointer;
            margin: 100px auto;
        }
        button:hover{
            transform:scale(1.05);
        }
        button:focus{
            outline: 0;
        }
        .green{
            background-color: green;
        }
        .orange{
            background-color: orange;
        }
        .pink{
            background-color: pink;
        }
        .blue{
            background-color: rgb(52, 52, 237);
        }
        .yellow{
            background-color: yellow;
        }
    </style>
</head>
<body>
    <h1>Background Change On Button Click</h1>
    <button class="green" id="greenbtn">Green</button>
    <button class="orange" id="orangebtn">Orange</button>
    <button class="pink" id="pinkbtn">Pink</button>
    <button class="blue" id="bluebtn">Blue</button>
    <button class="yellow" id="yellowbtn">yellow</button>



    <script>
        $(document).ready(function(){
            $("#greenbtn").click(function(){
                $("body").removeClass();
                $("body").addClass("green");
            });
            $("#orangebtn").click(function(){
                $("body").removeClass();
                $("body").addClass("orange");
            });
            $("#pinkbtn").click(function(){
                $("body").removeClass();
                $("body").addClass("pink");
            });
            $("#bluebtn").click(function(){
                $("body").removeClass();
                $("body").addClass("blue");
            });
            $("#yellowbtn").click(function(){
                $("body").removeClass();
                $("body").addClass("yellow");
            });
        });
    </script>
</body>
</html>
