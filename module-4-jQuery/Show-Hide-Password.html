<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <style>
        .container{
            width:700px;
            height: 300px;
            background-color: rgb(45, 56, 76);
            margin: 150px auto;
            border-radius: 20px;
        }
        h1{
            padding-top: 50px;
            padding-left: 170px;
            padding-bottom: 30px;
            color: white;
        }
        input{
            padding: 20px;
            margin-left: 30px;
            border: none;
            outline: none;
            border-radius: 10px 0px 0px 10px;
            font-size: 15px;
        }
        button{
            padding: 20px;
            border:none;
            outline: none;
            font-weight: 700;
            color:rgb(45, 56, 76) ;
            border-radius: 0px 10px 10px 0px;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
    <h1>Show And Hide Password</h1>
    <input type="password" id="showpass"><button id="show">Show</button>
    <input type="text" id="hidepass"><button id="hide">Hide</button>
</div>

<script>
    $(document).ready(function(){
     $("#show").click(function(){
            $("#showpass").attr("type","text");
     });
    });

    $("#hide").click(function(){
            $("#hidepass").attr("type","password");
     });
</script>
</body>
</html>
