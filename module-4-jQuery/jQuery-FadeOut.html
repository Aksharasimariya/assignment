<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        body{
            background-color: lightpink;
        }
        h1{
            text-align: center;
            font-size: 40px;
            padding-top: 20px;
        }
        .container{
            width: 1200px;
            height: 500px;
            background-color: rgb(48, 27, 82);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 40px auto;
            gap:30px;
            border-radius: 20px;
        }
        .box1{
            width: 300px;
            height: 300px;
            object-fit: cover;
            overflow: hidden;
            border-radius: 10px;
        }
        .box2{
            width: 300px;
            height: 300px;
            object-fit: cover;
            overflow: hidden;
            border-radius: 10px;
        }
        .box3{
            width: 300px;
            height: 300px;
            object-fit: cover;
            overflow: hidden;
            border-radius: 10px;
        }
        button{
            margin-top: 400px;
            width: 100px;
            height: 50px;
            background-color: rgb(159, 99, 175);
            color:white;
            font-size: 20px;
            border-radius: 10px;
        }

    </style>
</head>
<body>
    <h1>jQuery FadeOut</h1>
    <div class="container">
    <div class="box1" id="">
        <img src="./images/pexels-photo-1477166.jpeg" alt="">
    </div>
    <div class="box2" id="">
        <img src="./images/pexels-photo-1477166.jpeg" alt="">
    </div>
    <div class="box3" id="">
        <img src="./images/pexels-photo-1477166.jpeg" alt="">
    </div>
    <button id="show">Show</button>
</div>

<script>
        $(document).ready(function(){
        $("#show").click(function(){
            $(".box2").fadeTo(1000,0.6);
        });
    });
        $(document).ready(function(){
        $("#show").click(function(){
            $(".box3").fadeTo(1000,0.2);
        });
    });
</script>

</body>
</html>
