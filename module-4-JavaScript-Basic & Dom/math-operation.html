<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        .box{
            margin: 100px auto;
            padding: 20px;
            width: 600px;
            height: 400px;
            border:2px solid black;
            }
            h1{
                text-align: center;
                font-size: 40px;
                margin-bottom: 30px;
            }
            label{
                font-size: 30px;
                margin: 20px;
            }
            .input{
                font-size: 25px;
            }
            .btn{
                width: 50px;
                height: 50px;
                margin-top: 30px;
                margin-left: 20px;
                text-align: center;
                font-size: 30px;
            }
            .anslable{
                padding-left: 80px;
                font-size: 25px;
            }

    </style>
</head>
<body>
    <div class="box">
        <h1>Maths Operation</h1>
        <label for="">Enter 1st number:</label>
        <input type="number" placeholder="Enter 1st number" class="input" id="num1">
        <br>
        <br>
        <label for="">Enter 2st number:</label>
        <input type="number" placeholder="Enter 2st number" class="input" id="num2">
        <br>
        <button class="btn" id="plus">+</button>
        <button class="btn" id="minus">-</button>
        <button class="btn" id="multiply">*</button>
        <br>
        <button class="btn" id="division">/</button>
        <button class="btn" id="modulo">%</button>
        
        <label for="" class="anslable" >Answer is:</label>
        <input type="number" id="ans">

    </div>

    <script>
        let num1=document.getElementById("num1");
        let num2=document.getElementById("num2");
        let ans=document.getElementById("ans");
        
        
    plus.addEventListener('click',function(){
        ans.value=parseInt(num1.value) + parseInt(num2.value);
        });

    minus.addEventListener('click',function(){
        ans.value=parseInt(num1.value) - parseInt(num2.value);
    });

    multiply.addEventListener('click',function(){
        ans.value=parseInt(num1.value) * parseInt(num2.value);
    });

    division.addEventListener('click',function(){
        ans.value=parseInt(num1.value) / parseInt(num2.value);
    });

    modulo.addEventListener('click',function(){
        ans.value=parseInt(num1.value) % parseInt(num2.value);
    });


    
        
    </script>
</body>
</html>
