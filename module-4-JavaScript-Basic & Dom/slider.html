<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <style>
        * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        }
        body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #fafafa;
        }
        .container{
            background-color: black;
            color: white;
            text-align: center;
            border-radius: 10px;
        }
        h1{
            padding: 20px;
        }  
        .slider {
        position: relative;
        width: 100%;
        height: 100%;
        }
        .slide {
        width: 100%;
        height: 100%;
        display: none;
        object-fit: cover;
        border-radius: 10px;
        }
        .slide.active {
        display: block;
        }
        .prev,
        .next {
        position: absolute;
        top: 50%;
        background-color: rgba(0, 0, 0, 0.5);
        color: white;
        border: none;
        padding: 10px;
        cursor: pointer;
        transform: translateY(-50%);
        }
        .prev {
        left: 400px;
        }
        .next {
        right: 400px;
        }
        .prev:hover,
        .next:hover {
        background-color: rgba(0, 0, 0, 0.7);
        }
</style>
</head>
<body>
    <div class="container">
        <h1>JavaScript Slider</h1>
    <div class="slider">
        <img src="./pexels-photo-1477166.jpeg" alt="" class="slide">
        <img src="./pexels-photo-1767428.jpeg" alt="" class="slide">
        <img src="./pexels-photo-531910.jpeg" alt="" class="slide">
        <img src="./pexels-photo-992734.jpeg" alt="" class="slide">
    </div>

</div>
<button class="prev" onclick="prevSlide()">❮</button>
<button class="next" onclick="nextSlide()">❯</button>
</div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        function showSlide(index) {
        slides.forEach((slide) => slide.classList.remove('active'));
        if (index >= slides.length) {
            currentSlide = 0; 
        } else if (index < 0) {
            currentSlide = slides.length - 1; 
        } else {
            currentSlide = index;
        }
        slides[currentSlide].classList.add('active');
    }
        function nextSlide() {
        showSlide(currentSlide + 1);
        }
        function prevSlide() {
        showSlide(currentSlide - 1);
        }
        showSlide(currentSlide);
</script>
</body>
</html>
