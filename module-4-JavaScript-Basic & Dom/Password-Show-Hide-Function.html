<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Field with Show/Hide</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
.container{
    width: 500px;
    height: 300px;
    margin: 100px auto;
    background-color: rgb(49, 111, 225);
   }
   .wrapper{
    padding-top: 100px;
    padding-left: 130px;
    }
   input{
    padding:15px;
    border-radius: 5px;
    font-size: 15px;
    border:0px;
    outline: 0px;
   }
   button{
    width: 50px;
    height: 45px;
    border-radius: 5px;
    font-size: 15px;
    border:0px;
    outline:0px;
    margin-left:0px;
   }
</style>
  
</head>
<body>
  

  <div class="container">
    <div class="wrapper">
    <input type="password" placeholder="Enter your password" id="password1">
    <button id="eye-show-icon"><i class="fa-solid fa-eye" ></i></button>
   
    
   
     <br><br>
    <input type="text" placeholder="Enter your password" id="password2">
    <button><i class="fa-solid fa-eye-slash" id="eye-hide-icon"></i></button>
    
</div>
  </div>
<script>


let password1=document.getElementById("password1");
let eyeShowIcon=document.getElementById("eye-show-icon");

let password2=document.getElementById("password2");
let eyeHideIcon=document.getElementById("eye-hide-icon");


eyeShowIcon.addEventListener("click",()=> {
  password1.type="text";
})

eyeHideIcon.addEventListener("click",()=> {
  password2.type="password";
})
</script>
</body>
</html>
